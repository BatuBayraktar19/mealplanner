    <main>
      <form>
        <div class="input-wrapper">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" placeholder="Enter a name" />
        </div>
        <div class="input-wrapper">
          <label for="calories">Calories</label>
          <input type="number" name="calories" id="calories" placeholder="Enter calories amount" />
        </div>
        <div class="input-wrapper">
          <label for="ingredients">Ingredients</label>
          <div class="ingredient-wrapper">
            <input type="text" name="ingredients" id="ingredients" placeholder="Add ingredients" />
            <button class="add-item">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"

              </svg>
            </button>
          </div>
        </div>

        <button class="save-button" type="submit">Save</button>
      </form>
