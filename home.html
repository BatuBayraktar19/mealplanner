<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="home.css" />
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>Change Home</h1>
    </header>

    <main>
      <form>
        <div class="input-wrapper">
          <label for="homes">Select your Home</label>
          <select name="homes" id="homes">
            <option value="home1">Home 1</option>
            <option value="home2">Home 2</option>
            <option value="home3">Home 3</option>
          </select>
        </div>
        <div class="input-wrapper">
          <label for="newHome">Add new home</label>
          <input type="text" name="newHome" id="newHome" placeholder="Enter passcode" />
        </div>
        <a class="default-button" href="/index.html">Log in new Home</a>
      </form>
    </main>
  </div>
</body>

<footer class="navigation"></footer>

</html>
